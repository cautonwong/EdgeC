description: Renergy RN8xxx Timer/Counter (TC)
compatible: "renergy,rn8xxx-tc"
include: [base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
---
description: Renergy RN8xxx PWM (SIMPTC)
compatible: "renergy,rn8xxx-pwm"
include: [base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
    "#pwm-cells":
      const: 2
---
description: Renergy RN8xxx GDMA Controller
compatible: "renergy,rn8xxx-dma"
include: [dma-controller.yaml, base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
    "#dma-cells":
      const: 1
---
description: Renergy RN8xxx Keystore (Secure Key Storage)
compatible: "renergy,rn8xxx-keystore"
include: [base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
