description: Renergy RN8xxx GPIO Node
compatible: "renergy,rn8xxx-gpio"
include: [gpio-controller.yaml, base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
    gpio-controller:
      required: true
    "#gpio-cells":
      const: 2
    ngpios:
      required: true
      type: int
---
description: Renergy RN8xxx ADC controller
compatible: "renergy,rn8xxx-adc"
include: [adc-controller.yaml, base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
    "#adc-cells":
      const: 1
---
description: Renergy RN8xxx RTC
compatible: "renergy,rn8xxx-rtc"
include: [base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
---
description: Renergy RN8xxx Watchdog (WDT)
compatible: "renergy,rn8xxx-wdt"
include: [base.yaml]
properties:
    reg:
      required: true
    interrupts:
      required: true
