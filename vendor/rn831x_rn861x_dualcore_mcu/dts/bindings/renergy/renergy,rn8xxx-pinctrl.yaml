description: Renergy RN8xxx Pin Controller
compatible: "renergy,rn8xxx-pinctrl"
include: [pinctrl-device.yaml, base.yaml]
properties:
    reg:
      required: true
child_binding:
    description: Renergy pin configuration node
    include: [pinctrl-pkt.yaml]
    properties:
        pinmux:
          required: true
          type: int-array
          description: |
            Array of pins and their mux functions.
            Bits 0-7: Pin number
            Bits 8-15: Mux function
