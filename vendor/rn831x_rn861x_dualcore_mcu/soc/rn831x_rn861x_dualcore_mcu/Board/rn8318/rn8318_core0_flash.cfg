# please use >= 2025.02 openocd

#########  PART 0 用户配置  #########
# 是否支持flash下载
set set_flash_bank 1
#########  PART 1  FDTI 调试器基本配置 含速率/USB端口/基本调试信号配置  #########
adapter speed 4000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# nscan1_mode on-开cJTAG   off-关闭cJTAG
ftdi nscan1_mode on

transport select jtag

ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100

#########  PART 2 芯片基本信息配置 jtag IDCODE/flash分配/sram分配/调试对象创建(target)  #########
# core0 tap define
set _CHIPNAME0  core0
jtag newtap $_CHIPNAME0 cpu -irlen 5   -expected-id 0x10300a6d
set _TARGETNAME0 $_CHIPNAME0.cpu
# core1 tap define
set _CHIPNAME1  core1
jtag newtap $_CHIPNAME1 cpu -irlen 5    -expected-id 0x10200a6d
set _TARGETNAME1 $_CHIPNAME1.cpu

# 调试目标核配置
target create $_TARGETNAME0 riscv -chain-position $_TARGETNAME0  -coreid 0

set _ram_size     0x4000
$_TARGETNAME0 configure -work-area-phys 0x10000000 -work-area-size $_ram_size -gdb-port 3333 -work-area-backup 1

echo "\n**** RENERGY core0 debug configuration ****\n"

echo "This cfg file could debug core0 or download flash code for core0 or core1  ...\n"

if { [info exists  set_flash_bank ] } {
    # flashloader file cfg
    set _flash_loader_path "loader_debug.bin"

    # find file $_flash_loader_path
    if { [catch {find $_flash_loader_path} FOUND_PATH] } {
        echo "ERROR NO flash_loader file $_flash_loader_path exists"
    } else {
        # source $FOUND_PATH
        set _flash_loader_path $FOUND_PATH
        echo "INFO flash_loader file $FOUND_PATH exists"
    }
    #  sectorsize 为擦除最小单位不配置 按照0x100000(64k作为擦除最小单位) simulation 表示编程算法不设超时否则openocd 编程运行存在超时
    flash bank $_CHIPNAME0.flash0 custom 0x00000000 0 0 0 $_TARGETNAME0 0x00000000 $_flash_loader_path simulation sectorsize=0x200
    flash bank $_CHIPNAME0.flash1 custom 0x80000000 0 0 0 $_TARGETNAME0 0x80000000 $_flash_loader_path simulation sectorsize=0x200

} else {
    echo "INFO do not set flash bank "
}

#########  PART 3 自定义函数管理
# 寄存器读取函数 打印寄存名称和地址
proc read_register {name addr} {
    set REG_VALUE  [eval "mdw $addr"]
    set VALUE [lindex [split $REG_VALUE ":"] end]
    echo  "The $name reg value is: $VALUE"
}

# 释放core1
proc release_core1 { } {

    echo  "\n\n**********************"
    # 写 SYSCTL_CORE0->SYS_PSW1
    mww 0x20080000 0x82
    echo  "relese core1"
    # 写 SYSCTL_CORE0->RST_STOP_CTL
    mww 0x20080304 3

    read_register RST_STOP_CTL  0x20080304
}
# 分配sram
proc config_sram_scu { } {
    # 写 SCU_CORE0->WKEY
    mww 0x30018000 0xA5387492
    # 写 SCU_CORE0->SRAM_CFG
    mww 0x3001805C 5
    read_register SRAM_CFG  0x3001805C
    sleep 1
    echo  "**********************\n\n"
}
# jtag 连接延时等待函数
proc tmp_jtag_post_end { } {
    echo "****** in tmp_jtag_post_end"
    runtest 240000
}
proc core0_download_finish { } {
    echo  "\n\n**********************"
    echo  "core 0 download finish "
    echo  "**********************\n\n"
}
proc core1_download_finish { } {
    echo  "\n\n**********************"
    echo  "core 1 download finish "
    echo  "**********************\n\n"
}
proc tmp_reset_end { } {
    # halt
    # sleep 100
    echo "\n****** in tmp_reset_end\n"
}
proc reset_deassert_post { } {
    echo "*** in reset_deassert_post ***"
    # runtest 300000
}

#########  PART 4 其它配置 gdb 配置 事件注册  #########
gdb flash_program enable

# 配置默认为 hard breakpoints
gdb breakpoint_override hard

# 配置 reset-deassert-post event
# $_TARGETNAME0 configure -event reset-deassert-post  reset_deassert_post

# 配置 reset-end event
# $_TARGETNAME0 configure -event reset-end  tmp_reset_end

######### PART 5 初始化及执行阶段  #########
init
halt
