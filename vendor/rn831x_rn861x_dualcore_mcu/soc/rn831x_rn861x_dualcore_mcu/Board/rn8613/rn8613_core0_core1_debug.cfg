# please use >= 2025.02 openocd
#########  PART 0 用户配置  #########
# ram size 配置
set _core0_ram_size 0x14000
#  配置为1 复位过程中 1:分配sram 0:不分配sram
set ::reset_config(_set_sram_cfg)  1
#  配置为1 复位过程中 1:release core1  0:不释放
set ::reset_config(_release_core1) 1
#  配置为1 复位过程中 每个核等待时间（jtag clk）
set ::reset_deassert_config(wait_time) 300

#########  PART 1  FDTI 调试器基本配置 含速率/USB端口/基本调试信号配置  #########
adapter speed 4000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# nscan1_mode  on->cjtag  off->jtag
ftdi nscan1_mode on

transport select jtag

ftdi layout_init 0x0008 0x001b
# ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100

#########  PART 2 芯片基本信息配置 jtag IDCODE/flash分配/sram分配/调试对象创建(targetDE)  #########
# core0 tap define
set _CHIPNAME0  core0
jtag newtap $_CHIPNAME0 cpu -irlen 5   -expected-id 0x10300a6d
set _TARGETNAME0 $_CHIPNAME0.cpu

# core1 tap define
set _CHIPNAME1  core1
jtag newtap $_CHIPNAME1 cpu -irlen 5    -expected-id 0x10200a6d
set _TARGETNAME1 $_CHIPNAME1.cpu

# 调试目标核配置
target create $_TARGETNAME0 riscv -chain-position $_TARGETNAME0  -coreid 0
target create $_TARGETNAME1 riscv -chain-position $_TARGETNAME1  -coreid 0

# 设置 ram size
$_TARGETNAME0 configure -work-area-phys 0x10000000 -work-area-size $_core0_ram_size -gdb-port 3333 -work-area-backup 1
set _core1_ram_size [format "0x%x" [expr {0x28000 - $_core0_ram_size}]]
$_TARGETNAME1 configure -work-area-phys 0x90000000 -work-area-size $_core1_ram_size -gdb-port 3334 -work-area-backup 1

echo "\n\n**** RENERGY core0/core1 debug cfg, only for debug ... \n\n"



$_TARGETNAME0 configure -event reset-end  core0_reset_end

proc core0_reset_end { } {
    echo "****** in core0_reset_end"
    upvar t t
    set _current_core0_ram [$t cget -work-area-size]
    set _core0_ram_size [format "0x%x" $_current_core0_ram]
    upvar halt up_halt
    upvar _core0_ram_size _ram_size
    if { $up_halt }  {
        if { $::reset_config(_set_sram_cfg) }  {
            set_sram_cfg
        }
        if { $::reset_config(_release_core1) }  {
            release_core1_by_core0
        }
        read_register tw  0x3000022c
        read_register remap  0x20080500
    } else {
        echo  "**********reset run not release************"

    }
    echo "****** out core0_reset_end"
}
proc core1_reset_end { } {
    echo "****** in core1_reset_end"
    upvar halt up_halt
    if { $up_halt }  {
    	read_register remap   0xA0080500
    } else {
        echo  "**********reset run not release************"
    }
    echo "****** out core1_reset_end"
}

# *****************************
# 调整 ocd_process_reset_inner 流程

proc ocd_process_reset_inner { MODE } {
	set targets [target names]

	# If this target must be halted...
	switch $MODE {
		halt -
		init {
			set halt 1
		}
		run {
			set halt 0
		}
		default {
			return -code error "Invalid mode: $MODE, must be one of: halt, init, or run";
		}
	}

	# Target event handlers *might* change which TAPs are enabled
	# or disabled, so we fire all of them.  But don't issue any
	# target "arp_*" commands, which may issue JTAG transactions,
	# unless we know the underlying TAP is active.
	#
	# NOTE:  ARP == "Advanced Reset Process" ... "advanced" is
	# relative to a previous restrictive scheme

	foreach t $targets {
		echo "The target name value is: $t"
		# New event script.
		$t invoke-event reset-start
	}

	# Use TRST or TMS/TCK operations to reset all the tap controllers.
	# TAP reset events get reported; they might enable some taps.
	init_reset $MODE

	# Examine all targets on enabled taps.
	foreach t $targets {
		if {![using_jtag] || [jtag tapisenabled [$t cget -chain-position]]} {
			$t invoke-event examine-start
			set err [catch "$t arp_examine allow-defer"]
			if { $err } {
				$t invoke-event examine-fail
			} else {
				$t invoke-event examine-end
			}
		}
	}

	# Assert SRST, and report the pre/post events.
	# Note:  no target sees SRST before "pre" or after "post".
	foreach t $targets {
		$t invoke-event reset-assert-pre
	}
	foreach t $targets {
		# C code needs to know if we expect to 'halt'
		if {![using_jtag] || [jtag tapisenabled [$t cget -chain-position]]} {
			$t arp_reset assert $halt
		}
	}
	foreach t $targets {
		$t invoke-event reset-assert-post
	}

	# Now de-assert SRST, and report the pre/post events.
	# Note:  no target sees !SRST before "pre" or after "post".
	foreach t $targets {
		$t invoke-event reset-deassert-pre
		# Again, de-assert code needs to know if we 'halt'
		if {![using_jtag] || [jtag tapisenabled [$t cget -chain-position]]} {
			$t arp_reset deassert $halt
		}
		$t invoke-event reset-deassert-post



		if { $halt } {
			# foreach t $targets {
				if {[using_jtag] && ![jtag tapisenabled [$t cget -chain-position]]} {
					continue
				}

				# # don't wait for targets where examination is deferred
				# # they can not be halted anyway at this point
				# if { ![$t was_examined] && [$t examine_deferred] } {
				# 	continue
				# }

				if { ![$t was_examined] } {
					# don't wait for targets where examination is deferred
					# they can not be halted anyway at this point
					if { [$t examine_deferred] } {
						continue
					}
					# try to re-examine or target state will be unknown
					$t invoke-event examine-start
					set err [catch "$t arp_examine allow-defer"]
					if { $err } {
						$t invoke-event examine-fail
						return -code error [format "TARGET: %s - Not examined" $t]
					} else {
						$t invoke-event examine-end
					}
				}


				# Wait up to 1 second for target to halt. Why 1sec? Cause
				# the JTAG tap reset signal might be hooked to a slow
				# resistor/capacitor circuit - and it might take a while
				# to charge

				# Catch, but ignore any errors.
				catch { $t arp_waitstate halted 1000 }

				# Did we succeed?
				set s [$t curstate]

				if { $s != "halted" } {
					return -code error [format "TARGET: %s - Not halted" $t]
				}
			# }
		}

		#Pass 2 - if needed "init"
		if { $MODE == "init" } {
			# foreach t $targets {
				if {[using_jtag] && ![jtag tapisenabled [$t cget -chain-position]]} {
					continue
				}

				# don't wait for targets where examination is deferred
				# they can not be halted anyway at this point
				if { ![$t was_examined] && [$t examine_deferred] } {
					continue
				}

				set err [catch "$t arp_waitstate halted 5000"]
				# Did it halt?
				if { $err == 0 } {
					$t invoke-event reset-init
				}
			# }
		}

		# foreach t $targets {
			$t invoke-event reset-end
		# }
	}
	# foreach t $targets {
	# }
	# foreach t $targets {
	# }

	# Pass 1 - Now wait for any halt (requested as part of reset
	# assert/deassert) to happen.  Ideally it takes effect without
	# first executing any instructions.
}

# 寄存器读取函数 打印寄存名称和地址
proc read_register {name addr} {
    set REG_VALUE  [eval "mdw $addr"]
    set VALUE [lindex [split $REG_VALUE ":"] end]
    echo  "The $name reg value is: $VALUE"
}
proc release_core1_by_core0 { } {
    echo  "\n\n**********************"
    # 写 SYSCTL_CORE0->SYS_PSW1
    mww 0x20080000 0x82
    echo  "relese core1\n"
    # 写 SYSCTL_CORE0->RST_STOP_CTL
    mww 0x20080304 3

    read_register RST_STOP_CTL  0x20080304
}
proc set_sram_cfg { } {
    upvar _core0_ram_size _core0_ram_size
    set _sram_cfg   [expr { $_core0_ram_size >> 14 }]
    if { [expr { ($_sram_cfg > 1) && ($_sram_cfg < 10) }] } {
        echo  "\n**********************"
        echo  "setted core0 ram_size = $_core0_ram_size"
        # 写 SCU_CORE0->WKEY
        mww 0x30018000 0xA5387492
        # 写 SCU_CORE0->SRAM_CFG
        mww 0x3001805C $_sram_cfg

        read_register RST_STOP_CTL  0x20080304
        read_register SRAM_CFG  0x3001805C
        echo  "**********************\n"
    } else {
        echo  "ERROR: current ram_size = $_core0_ram_size can not release core1 (n300)!"
    }
}
proc halt_all_hart { } {
    foreach t [target names] {
    	targets $t
    	halt
    }
}
# reset_deassert_post function
proc core1_reset_deassert_post { } {
    echo "*** in core1_reset_deassert_post ***"
    runtest $::reset_deassert_config(wait_time)
}

proc core0_reset_deassert_post { } {
    echo "*** in core0_reset_deassert_post ***"
    runtest $::reset_deassert_config(wait_time)
}

######### PART 4 其它配置 gdb 配置 事件注册  #########

# 配置默认为 hard breakpoints
gdb breakpoint_override hard

# 配置 reset-deassert-post event
$_TARGETNAME1 configure -event reset-deassert-post  core1_reset_deassert_post
$_TARGETNAME0 configure -event reset-deassert-post  core0_reset_deassert_post

# 配置 reset-end event
$_TARGETNAME1 configure -event reset-end  core1_reset_end
$_TARGETNAME0 configure -event reset-end  core0_reset_end


######### PART 5 初始化及执行阶段  #########
init
halt_all_hart
