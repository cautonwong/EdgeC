 # please use >= 2022.08 openocd
# some commands are changed to match latest openocd changes
adapter speed 1000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
#on-开cJTAG   off-关闭cJTAG
ftdi nscan1_mode on
## bindto 0.0.0.0 can be used to cover all available interfaces.
## Uncomment bindto line to enable remote machine debug
# bindto 0.0.0.0

## you can also specify adapter serial to select a ftdi chip
# adapter serial "FT6S9RD6"

## Bind JTAG with specified serial number passed by JTAGSN
# https://doc.nucleisys.com/nuclei_sdk/develop/buildsystem.html#jtagsn
if { [ info exists JTAGSN ] } {
    puts "Bind JTAG with serial number $JTAGSN"
    adapter serial $JTAGSN
}

transport select jtag

ftdi layout_init 0x0008 0x001b
# ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100

# core0 list tap
set _CHIPNAME0  core0
jtag newtap $_CHIPNAME0 cpu -irlen 5   -expected-id 0x10300a6d
# jtag newtap $_CHIPNAME0 cpu -irlen 5   -expected-id 0x10200a6d
set _TARGETNAME0 $_CHIPNAME0.cpu


# core1 can  be debug
set _CHIPNAME1  core1
jtag newtap $_CHIPNAME1 cpu -irlen 5    -expected-id 0x10200a6d
# jtag newtap $_CHIPNAME1 cpu -irlen 5    -expected-id 0x10300a6d
set _TARGETNAME1 $_CHIPNAME1.cpu

target create $_TARGETNAME1 riscv -chain-position $_TARGETNAME1  -coreid 0
$_TARGETNAME1 configure -work-area-phys 0x90000000 -work-area-size 0xa000 -work-area-backup 1


echo "only for core1 debug \n\n"

$_TARGETNAME1 configure -event reset-end  tmp_reset_end
proc tmp_reset_end { } {

    # 设置PC指针
    # set_reg {pc 0x80000000}

    upvar halt up_halt
    if { $up_halt }  {
    set REG_VALUE  [eval "get_reg -force {pc sp}"]

    echo "The REG_VALUE reg value is: $REG_VALUE"
        # set_pc_remap_tw
    }
    echo "****** out tmp_reset_end"

}

# gdb_flash_program enable
Configure default hard breakpoints
gdb_breakpoint_override hard
init
# if {[ info exists pulse_srst]} {
# ftdi_set_signal nSRST 0
# ftdi_set_signal nSRST z
# }
# init
halt
# reset halt
