name: fixture
jobs:
  build:
    steps:
      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -E '^app_platform_e2e$'

      - name: Run Privileged E2E
        run: |
          cd build
          sudo -E env PATH="$PATH" \
            ctest -R '^app_platform_e2e$' --output-on-failure
