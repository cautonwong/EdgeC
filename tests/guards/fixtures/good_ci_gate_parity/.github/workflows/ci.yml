jobs:
  build-and-test:
    steps:
      - name: Run Architecture & Anti-Entropy Gates (x86_64 only)
        if: matrix.config.target == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/scripts/run_guard_selftest.py
          python3 ci/scripts/check_component_budgets.py --root . --build build
          STRICT_CORE_GATE=1 ./scripts/check_core_symbols.sh
          ./scripts/check_binary_sizes.sh | tee build/size_report.txt
          ./ci/scripts/check_formal.sh ${FORMAL_STRICT:+--strict}
          ./ci/scripts/check_formal_negative.sh ${FORMAL_STRICT:+--strict}
          python3 ci/scripts/check_formal_sync.py --root .
          python3 ci/scripts/check_formal_isolation.py --root .

  formal:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Run formal gate
        run: |
          ./ci/scripts/check_formal.sh --strict
          ./ci/scripts/check_formal_negative.sh --strict
          python3 ci/scripts/check_formal_sync.py --root .
          python3 ci/scripts/check_formal_isolation.py --root .
