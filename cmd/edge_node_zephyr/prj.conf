# Kconfig 最佳实践：按模块组织配置

# 1. 基础系统配置
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# 2. 日志子系统 (工业应用必备)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# 3. 内存管理 (如果后续要运行小规模 WASM 或算法)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# 4. 调试增强
CONFIG_DEBUG_INFO=y
CONFIG_ASSERT=y
