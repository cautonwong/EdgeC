# [Omnis] IEMS 产品清单 (Standard Assembler V5.0)
# ------------------------------------------------------------------------------

product: "IEMS_Controller_V4"

# 1. 物理/逻辑通道定义 (The Channels - OS 层资源)
connectivity:
  - id: 0
    label: "RS485_Main"
    category: "SOUTHBOUND"
    type: "UART"
    config: { path: "/dev/ttyS1", baud: 9600 }
    simulation: { transport: "UDS", endpoint: "UDS:/tmp/vbus0.sock" }

  - id: 200
    label: "HighSpeed_ADC"
    category: "INTERNAL"
    type: "MEM_RING"
    config: { shm_name: "adc_raw", size: 1024 }
    simulation: { transport: "MEMFD", control_sock: "/tmp/v_adc.sock" }

# 2. 设备挂载定义 (Device Attachments - 业务层资产)
devices:
  - id: "METER_MAIN"
    bus_id: 0
    protocol: "ModbusRTU"
    address: 1
    model: "Acrel_P80" # 关联 contracts/bindings/modbus/acrel_p80.yaml

# 3. 乐高拼装：包含原子点表模板
include:
  - "contracts/bindings/modbus/acrel_p80.yaml"
  - "contracts/bindings/dlt645/standard_meter.yaml"
  - "contracts/bindings/can/catl_bms.yaml"
  - "cmd/iems/features/solar_module.yaml"

# 4. 运行期测点策略
enabled_tags:
  - tag: GRID_POWER
    attributes: { poll_interval_ms: 500 }
  - tag: VOLTAGE_PHASE_A
    attributes: { poll_interval_ms: 500 }

# 5. 数据管线
pipelines:
  - id: "energy_manager"
    trigger: "GRID_POWER"
    stages:
      - type: "energy_integrator"
        config: { state_tag: 3001 }
      - type: "sqlite_sink"
        config: { table: "energy_history" }

  - id: "overvoltage_protection"
    trigger: "VOLTAGE_PHASE_A"
    stages:
      - type: "REFLEX"
        config:
          bus_id: 0
          protocol: "ModbusRTU"
          target_tag: 8004 # SOLAR_RELAY
          threshold: 264.0
          greater_than: true
          action_value: 0.0 # Open relay