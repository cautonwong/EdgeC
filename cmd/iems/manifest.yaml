# [Omnis] IEMS Deployment Manifest (Site Specific)
# ------------------------------------------------------------------------------
# 这是一个纯部署清单。核心业务逻辑请参考 contracts/products/iems_v5.yaml

# 1. 物理/逻辑通道定义 (The Channels - OS 层资源)
connectivity:
  - id: 0
    label: "RS485_Main"
    category: "SOUTHBOUND"
    type: "UART"
    config: { path: "/dev/ttyS1", baud: 9600 }
    simulation: { transport: "UDS", endpoint: "UDS:/tmp/vbus0.sock" }

  - id: 200
    label: "HighSpeed_ADC"
    category: "INTERNAL"
    type: "MEM_RING"
    config: { shm_name: "adc_raw", size: 1024 }
    simulation: { transport: "MEMFD", control_sock: "/tmp/v_adc.sock" }

  - id: 1
    label: "CAN_Main"
    category: "SOUTHBOUND"
    type: "CAN"
    config: { path: "can0", baud: 500000 }
    simulation: { transport: "UDS", endpoint: "UDS:/tmp/vbus1.sock" }

  - id: 10
    label: "Northbound_SCADA"
    category: "NORTHBOUND"
    type: "UART"
    config: { path: "/dev/ttyS2", baud: 115200 }
    simulation: { transport: "NONE", endpoint: "/tmp/iems_north_slave.sock" }

# 2. 设备挂载定义 (Device Attachments - 业务层资产)
devices:
  - id: "METER_MAIN"
    bus_id: 0
    protocol: "ModbusRTU"
    address: 1
    model: "Acrel_P80" 

  - id: "BMS_MAIN"
    bus_id: 1
    protocol: "CAN"
    address: 0
    model: "CATL_Rack_V1" 

  - id: "SCADA_MASTER"
    bus_id: 10
    protocol: "ModbusRTU"
    address: 1
    model: "Acrel_P80" 
    simulation: { actor: "supervisor" }
# 3. 现场微调 (Site Overrides)
# 仅在此处修改特定于该站点的参数，例如过压保护阈值
tags:
  - id: 5003 # IEMS_GRID_LIMIT_W
    attributes:
      default: 6000.0 # 现场变压器容量限制
