product: "IEMS_Controller_V1"
# 继承默认点表
includes:
  - "contracts/bindings/modbus_maps/default_device.yaml"

# 启用全局标准测点
enabled_tags:
  - GRID_POWER
  - VOLTAGE_PHASE_A
  - GRID_FREQUENCY
  - BATTERY_SOC
  - ROOM_HUMIDITY

# 项目现场独有硬件地址，但语义对齐全局 ROOM_HUMIDITY
tags:
  - id: 6001
    name: ROOM_HUMIDITY
    bindings:
      - protocol: MODBUS
        addr: 50002
        scale: 1.0
