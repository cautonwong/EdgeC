product: "IEMS_Controller_V1"
# 显式包含默认点表基类
includes:
  - "contracts/bindings/modbus_maps/default_device.yaml"

# 激活测点 (对齐 test_contract_lookup.c)
enabled_tags:
  - GRID_POWER
  - VOLTAGE_PHASE_A
  - GRID_FREQUENCY
  - BATTERY_SOC
  - PROJECT_HUMIDITY

# IEMS 专属物理映射覆盖 (最高优先级)
tags:
  - name: PROJECT_HUMIDITY
    bindings:
      - protocol: MODBUS
        addr: 50002
        scale: 1.0

  - id: 9005
    name: CUSTOM_TEMP_SENSOR
    type: float
    unit: C
    attributes: { upload: true }
    bindings:
      - protocol: MODBUS
        addr: 50001
        scale: 0.1