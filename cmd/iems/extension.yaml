# IEMS Extension for Sprint 4 (Omnis)
includes:
  - "features/solar_module.yaml"

enabled_tags:
  - tag: VOLTAGE_PHASE_A
    attributes:
      poll_interval_ms: 500  # [演习优化] 提高轮询频率
  - tag: GRID_POWER
    attributes:
      poll_interval_ms: 500
  - tag: ENERGY_ACTIVE_IMPORT
    attributes:
      poll_interval_ms: 500
  - GRID_FREQUENCY
  - BATTERY_SOC
  - BATTERY_POWER
  - PROJECT_HUMIDITY
  - SOLAR_VOLTAGE

parameters:
  - name: ALGO_UOV_LIMIT
    value: 250.0  # 演习设定的阈值

pipelines:
  - id: "overvoltage_protection"
    trigger: "VOLTAGE_PHASE_A"
    stages:
      - type: "REFLEX"
        min: 240.0        # -> f1 (threshold)
        max: 1.0          # -> f2 (greater_than flag)
        target_tag: 8001  # -> u1 (target_tag)
