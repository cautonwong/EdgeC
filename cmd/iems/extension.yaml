# IEMS Extension for Sprint 4 (Omnis)
enabled_tags:
  - tag: VOLTAGE_PHASE_A
    attributes:
      poll_interval_ms: 500  # [演习优化] 提高轮询频率
  - tag: GRID_POWER
    attributes:
      poll_interval_ms: 500
  - tag: ENERGY_ACTIVE_IMPORT
    attributes:
      poll_interval_ms: 500
  - GRID_FREQUENCY
  - BATTERY_SOC
  - BATTERY_POWER
  - PROJECT_HUMIDITY

parameters:
  - name: ALGO_UOV_LIMIT
    value: 250.0  # 演习设定的阈值

pipelines:
  - id: "overvoltage_protection"
    trigger: "VOLTAGE_PHASE_A"
    stages:
      - type: "reflex"
        params:
          f1: 240.0
          u1: 4003 # 触发电池反向压减
