product: "IEMS_Controller_V1"
includes:
  - "bindings/modbus_maps/default_device.yaml"

# List of semantic tags to be included in this product build.
enabled_tags:
  - GRID_POWER
  - VOLTAGE_PHASE_A
tags:
  - id: 9001
    name: CUSTOM_TEMP_SENSOR
    type: float
    unit: C
    attributes: { upload: true }
    bindings:
      - protocol: MODBUS
        addr: 50001
        scale: 0.1