product: "IEMS_Controller_V1"

# 现场特定配置 (Compile-time)
configs:
  - name: DLMS_HLS_SECURITY
    value: 1
  - name: DLMS_MAX_PDU
    value: 1024

# 运行期整定参数 (Site-specific tuning)
parameters:
  - name: ALGO_UOV_LIMIT
    type: float
    default: 260.0
    min: 220.0
    max: 300.0
    desc: "Site-specific over-voltage threshold"
  - name: ALGO_UOV_DELAY_S
    type: int
    default: 30
    min: 3
    max: 3600
    desc: "Site-specific over-voltage delay"

# 现场激活测点
enabled_tags:
  - GRID_POWER
  - VOLTAGE_PHASE_A
  - GRID_FREQUENCY
  - ENERGY_ACTIVE_IMPORT
  - BATTERY_SOC
  - BATTERY_POWER

tags:
  - id: 4001
    name: BATTERY_SOC
    bindings:
      - protocol: CAN
        can_id: 0x1801F456
        start: 0
        len: 8
        factor: 0.4
        offset: 0.0
      - protocol: IEC104
        ioa: 10001
        type_id: 30

  - id: 1003
    name: GRID_POWER
    bindings:
      - protocol: IEC104
        ioa: 20001
        type_id: 30