# DLMS Security and Management Objects (Based on BlueBook IC 15, 17, 64)
protocol: "DLMS"
model: "Management_Objects"
mappings:
  # --- SAP Assignment (IC 17) ---
  - tag: DLMS_SAP_LIST
    obis: "0.0.41.0.0.255"
    ic: 17
    attr: 2         # sap_assignment_list
    type: 19        # array of structs
    access: 1       # Get

  # --- Current Association (IC 15) ---
  - tag: DLMS_AUTH_MECHANISM
    obis: "0.0.40.0.0.255"
    ic: 15
    attr: 6         # authentication_mechanism_name
    type: 17        # enum
    access: 3       # Get, Set

  - tag: DLMS_REPLY_HLS
    obis: "0.0.40.0.0.255"
    ic: 15
    method: 1       # reply_to_HLS_authentication
    access: 4       # Action

  # --- Security Setup (IC 64) ---
  - tag: DLMS_SECURITY_POLICY
    obis: "0.0.43.0.0.255"
    ic: 64
    attr: 2         # security_policy
    type: 17        # enum
    access: 3       # Get, Set

  - tag: DLMS_SECURITY_SUITE
    obis: "0.0.43.0.0.255"
    ic: 64
    attr: 3         # security_suite
    type: 17        # enum
    access: 3       # Get, Set
