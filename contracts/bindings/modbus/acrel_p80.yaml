# Acrel P80 Smart Meter Binding
protocol: "MODBUS"
model: "Acrel_P80"
mappings:
  - tag: VOLTAGE_PHASE_A
    addr: 0x0000
    scale: 0.1
    desc: "A相电压 (0.1V)"

  - tag: GRID_FREQUENCY
    addr: 0x0034
    scale: 0.01
    desc: "电网频率 (0.01Hz)"

  - tag: GRID_POWER
    addr: 0x000C
    length: 2
    scale: 1.0
    desc: "总有功功率 (1W)"

  - tag: PROJECT_HUMIDITY
    addr: 0x00FF
    scale: 1.0
    desc: "项目湿度标记 (1.0=Triggered)"

  - tag: BATTERY_POWER
    addr: 0x000F
    scale: 0.01
    desc: "电池PCS功率 (0.01A)"

  - tag: BATTERY_SOC
    addr: 0x0105
    scale: 1.0
    desc: "电池SOC状态 (0-100)"
