# SunSpec IEEE 1547 / Model 101/103 Inverter Standard Binding
model: "SunSpec_Model101_Inverter"
protocol: "ModbusRTU"
mappings:
  - tag: CURRENT_PHASE_A
    addr: 40072
    type: uint16
    scaler: 0.01

  - tag: VOLTAGE_PHASE_A
    addr: 40076
    type: uint16
    scaler: 0.1

  - tag: GRID_POWER
    addr: 40084
    type: int16
    scaler: 1.0

  - tag: GRID_FREQUENCY
    addr: 40086
    type: uint16
    scaler: 0.01

  - tag: ENERGY_ACTIVE_IMPORT
    addr: 40094
    type: uint32
    scaler: 1.0
