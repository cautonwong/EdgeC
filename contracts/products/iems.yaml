# IEMS Controller Contract Definition
product: "IEMS_Controller_V1"
includes:
  - "contracts/bindings/modbus/acrel_p80.yaml"
  - "contracts/bindings/dlt645/standard_meter.yaml"
  - "contracts/bindings/iec104/relay_station.yaml"
  - "contracts/bindings/can/bms_j1939.yaml"

# 编译期配置 (KConfig Style)
configs:
  - name: DLMS_HLS_SECURITY
    value: 1
  - name: BUS_MAX_COUNT
    value: 8
  - name: NETBUF_POOL_SIZE
    value: 16
  - name: NETBUF_BLOCK_SIZE
    value: 2048

# 运行期整定参数 (Runtime Tunables)
parameters:
  - name: ALGO_UOV_LIMIT
    type: float
    default: 264.0
    min: 220.0
    max: 300.0
    desc: "Over-voltage threshold"
  - name: ALGO_UOV_DELAY_S
    type: int
    default: 60
    min: 3
    max: 3600
    desc: "Over-voltage delay"

enabled_tags:
  - tag: VOLTAGE_PHASE_A
    attributes:
      upload: true
      persist: true
      poll_interval_ms: 5000
  - tag: GRID_POWER
    attributes:
      upload: true
      poll_interval_ms: 1000
  - tag: ENERGY_ACTIVE_IMPORT
    attributes:
      upload: true
      persist: true
      poll_interval_ms: 10000
  - GRID_FREQUENCY
  - BATTERY_SOC
  - BATTERY_POWER
  - SYS_NETBUF_TOTAL
  - SYS_NETBUF_FREE
  - SYS_NETBUF_PEAK
  - SYS_NETBUF_LEAK_RECLAIM
