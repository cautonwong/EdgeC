# IEMS Controller Contract Definition
product: "IEMS_Controller_V1"
includes:
  - "contracts/bindings/modbus/acrel_p80.yaml"
  - "contracts/bindings/dlt645/standard_meter.yaml"
  - "contracts/bindings/iec104/relay_station.yaml"
  - "contracts/bindings/can/bms_j1939.yaml"

enabled_tags:
  - tag: VOLTAGE_PHASE_A
    attributes:
      upload: true
      persist: true
  - tag: GRID_POWER
    attributes:
      upload: true
  - tag: ENERGY_ACTIVE_IMPORT
    attributes:
      upload: true
      persist: true
  - GRID_FREQUENCY
  - BATTERY_SOC
  - BATTERY_POWER

configs:
  - name: BUS_MAX_COUNT
    value: 8
    desc: "Maximum number of communication buses"
  - name: NETBUF_POOL_SIZE
    value: 16
    desc: "Number of buffers in the global pool"
  - name: NETBUF_BLOCK_SIZE
    value: 2048
    desc: "Size of each buffer block"
