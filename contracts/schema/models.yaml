# [EdgeOS Contract] ADR-0009 / AEP-604: Industrial Edge AI Model Deployment Contract
version: "1.0.0"
description: "Model metadata, tensor shape, quantization profile, and execution backend constraints"

models:
  - id: "model_grid_anomaly_detector"
    name: "Grid Waveform Transient Anomaly Detector"
    architecture: "1D-CNN-Quantized"
    backend: "native_npu"
    version: "1.2.0"
    wcet_us: 1500
    memory_budget_bytes: 65536
    inputs:
      - name: "voltage_current_window"
        shape: [1, 128, 4]
        dtype: "int8"
        quantization:
          type: "asymmetric"
          scale: 0.00390625
          zero_point: -128
        source_tags: [1001, 1002, 1003, 1004]
    outputs:
      - name: "fault_probability"
        shape: [1, 4]
        dtype: "float32"
        target_tags: [12050]

  - id: "model_bms_thermal_runaway_pinn"
    name: "Physics-Informed Neural Network for Battery Cell Thermal Dynamics"
    architecture: "PINN-MLP"
    backend: "c_native"
    version: "2.0.1"
    wcet_us: 5000
    memory_budget_bytes: 131072
    inputs:
      - name: "cell_temperatures_and_currents"
        shape: [1, 32]
        dtype: "float32"
        source_tags: [11001, 11002]
    outputs:
      - name: "core_temp_gradient_and_risk"
        shape: [1, 8]
        dtype: "float32"
        target_tags: [12060]

  - id: "model_wasm_vibration_bearing_fault"
    name: "WASM Sandboxed High-Frequency Vibration Fault Classifier"
    architecture: "TinyMaix-Conv1D"
    backend: "wasm_wamr"
    version: "1.0.0"
    wcet_us: 10000
    memory_budget_bytes: 262144
    inputs:
      - name: "vibration_fft_bins"
        shape: [1, 64]
        dtype: "float32"
        source_tags: [13001]
    outputs:
      - name: "fault_classes_confidence"
        shape: [1, 4]
        dtype: "float32"
        target_tags: [13010]
