# [EdgeOS Contract] AEP-607: Virtual Synchronous Generator (VSG) & Fast Frequency Response (FFR) Profile
profile: "ems_vsg_profile"
version: "1.0.0"
description: "Grid-Forming Virtual Synchronous Generator and Fast Frequency Response parameter profile"

parameters:
  - name: "j_inertia"
    type: "float"
    unit: "kg*m^2"
    default: 10.0
    desc: "Virtual rotor moment of inertia J"
  - name: "d_damping"
    type: "float"
    unit: "N*m*s/rad"
    default: 25.0
    desc: "Virtual damping coefficient D"
  - name: "droop_p_f"
    type: "float"
    unit: "kW/Hz"
    default: 200.0
    desc: "Active power-frequency droop slope Dp"
  - name: "droop_q_v"
    type: "float"
    unit: "kVar/V"
    default: 50.0
    desc: "Reactive power-voltage droop slope Dq"
  - name: "virtual_r"
    type: "float"
    unit: "Ohm"
    default: 0.01
    desc: "Virtual stator resistance Rv"
  - name: "virtual_x"
    type: "float"
    unit: "Ohm"
    default: 0.05
    desc: "Virtual stator reactance Xv"
  - name: "loop_period_us"
    type: "uint"
    unit: "us"
    default: 500
    desc: "VSG control loop execution period (500us for 2kHz)"
  - name: "enable_ffr"
    type: "bool"
    unit: ""
    default: true
    desc: "Enable fast frequency response boost"

telemetry:
  - name: "grid_freq_hz"
    type: "float"
    unit: "Hz"
    desc: "Measured grid frequency at PCC"
  - name: "grid_volt_rms"
    type: "float"
    unit: "V"
    desc: "Measured PCC line-to-neutral voltage RMS"
  - name: "omega_virtual"
    type: "float"
    unit: "rad/s"
    desc: "Virtual rotor angular velocity"
  - name: "theta_virtual"
    type: "float"
    unit: "rad"
    desc: "Virtual internal electromotive force phase angle"
  - name: "p_active_mw"
    type: "float"
    unit: "MW"
    desc: "VSG dispatched active power"
  - name: "q_reactive_mvar"
    type: "float"
    unit: "MVar"
    desc: "VSG dispatched reactive power"
  - name: "id_ref"
    type: "float"
    unit: "A"
    desc: "d-axis converter current reference"
  - name: "iq_ref"
    type: "float"
    unit: "A"
    desc: "q-axis converter current reference"
  - name: "timestamp_mtt_ns"
    type: "uint64"
    unit: "ns"
    desc: "MTT deterministic monotonic wall-clock timestamp"
