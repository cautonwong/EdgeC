tags:
  # === 电力遥测 (1000-1999) ===
  - id: 1001
    name: VOLTAGE_PHASE_A
    type: float
    unit: V
    desc: "A相电压"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 500, precision: 1 }
      northbound: { storage: "trend", push: "periodic" }

  - id: 1002
    name: CURRENT_PHASE_A
    type: float
    unit: A
    desc: "A相电流"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 100 }
      northbound: { storage: "trend" }

  - id: 1003
    name: GRID_POWER
    type: float
    unit: W
    desc: "电网有功功率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params" }
      northbound: { push: "change", threshold: 10 }

  - id: 1004
    name: GRID_FREQUENCY
    type: float
    unit: Hz
    desc: "系统频率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 45, max: 55, precision: 2 }

  # === 能量计量 (3000-3999) ===
  - id: 3001
    name: ENERGY_ACTIVE_IMPORT
    type: double
    unit: kWh
    desc: "正向有功总电能"
    attributes: { persist: true, upload: true }

  - id: 3002
    name: ENERGY_ACTIVE_EXPORT
    type: double
    unit: kWh
    desc: "反向有功总电能"

  # === 电池管理 (4000-4999) ===
  - id: 4001
    name: BATTERY_SOC
    type: float
    unit: "%"
    desc: "电池剩余电量"
    attributes:
      category: "Storage"
      ui: { group: "Battery_Health", min: 0, max: 100, widget: "gauge" }
      northbound: { storage: "trend", push: "periodic" }

  - id: 4003
    name: BATTERY_POWER
    type: float
    unit: W
    desc: "电池实时功率 (正充负放)"

  # === 环境与项目扩展 (8000-8999) ===
  - id: 8001
    name: PROJECT_HUMIDITY
    type: float
    unit: "%"
    desc: "项目现场环境湿度"
    attributes:
      ui: { group: "Environment", min: 0, max: 100 }

  - id: 8002
    name: PLUG_OVERTEMP
    type: int
    desc: "插座过温报警"
    attributes: { alert: true }