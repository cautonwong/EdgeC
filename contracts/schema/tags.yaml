tags:
  # === 电力遥测 (1000-1999) ===
  - id: 1001
    name: VOLTAGE_PHASE_A
    type: float
    unit: V
    desc: "A相电压"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 500, precision: 1 }
      northbound: { storage: "trend", push: "periodic" }

  - id: 1002
    name: CURRENT_PHASE_A
    type: float
    unit: A
    desc: "A相电流"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 100 }
      northbound: { storage: "trend" }

  - id: 1003
    name: GRID_POWER
    type: float
    unit: W
    desc: "电网有功功率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params" }
      northbound: { push: "change", threshold: 10 }

  - id: 1004
    name: GRID_FREQUENCY
    type: float
    unit: Hz
    desc: "系统频率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 45, max: 55, precision: 2 }

  # === 电池管理 (4000-4999) ===
  - id: 4001
    name: BATTERY_SOC
    type: float
    unit: "%"
    desc: "电池剩余电量"
    attributes:
      category: "Storage"
      ui: { group: "Battery_Health", min: 0, max: 100, widget: "gauge" }
      northbound: { storage: "trend", push: "periodic" }

  - id: 4002
    name: BATTERY_SOH
    type: float
    unit: "%"
    desc: "电池健康度"

  - id: 4003
    name: BATTERY_POWER
    type: float
    unit: W
    desc: "电池实时功率 (正充负放)"

  # === 开关控制 (5000-5999) ===
  - id: 5001
    name: SWITCH_RELAY_1
    type: int
    desc: "1号继电器状态"
    attributes: { rw: "w" }
