tags:
  # === 电力遥测 (1000-1999) ===
  - id: 1001
    name: VOLTAGE_PHASE_A
    type: float
    unit: V
    desc: "A相电压"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 500, precision: 1 }
      northbound: { storage: "trend", push: "periodic" }

  - id: 1002
    name: CURRENT_PHASE_A
    type: float
    unit: A
    desc: "A相电流"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 0, max: 100 }
      northbound: { storage: "trend" }

  - id: 1003
    name: GRID_POWER
    type: float
    unit: W
    desc: "电网有功功率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params" }
      northbound: { push: "change", threshold: 10 }

  - id: 1004
    name: GRID_FREQUENCY
    type: float
    unit: Hz
    desc: "系统频率"
    attributes:
      category: "Metrology"
      ui: { group: "Grid_Params", min: 45, max: 55, precision: 2 }

  # === 能量计量 (3000-3999) ===
  - id: 3001
    name: ENERGY_ACTIVE_IMPORT
    type: double
    unit: kWh
    desc: "正向有功总电能"
    attributes: { persist: true, upload: true }

  - id: 3002
    name: ENERGY_ACTIVE_EXPORT
    type: double
    unit: kWh
    desc: "反向有功总电能"

  # === 电池管理 (4000-4999) ===
  - id: 4001
    name: BATTERY_SOC
    type: float
    unit: "%"
    desc: "电池剩余电量"
    attributes:
      category: "Storage"
      ui: { group: "Battery_Health", min: 0, max: 100, widget: "gauge" }
      northbound: { storage: "trend", push: "periodic" }

  - id: 4003
    name: BATTERY_POWER
    type: float
    unit: W
    desc: "电池实时功率 (正充负放)"

  # === 环境与项目扩展 (8000-8999) ===
  - id: 8001
    name: PROJECT_HUMIDITY
    type: float
    unit: "%"
    desc: "项目现场环境湿度"
    attributes:
      ui: { group: "Environment", min: 0, max: 100 }

  - id: 8002
    name: PLUG_OVERTEMP
    type: int
    desc: "插座过温报警"
    attributes: { alert: true }

  # === DLMS 安全与管理 (9000-9999) ===
  - id: 9001
    name: DLMS_SAP_LIST
    type: string
    desc: "DLMS逻辑设备映射列表 (SAP Assignment)"
    attributes:
      category: "System"

  - id: 9002
    name: DLMS_AUTH_MECHANISM
    type: int
    desc: "认证机制 (Authentication Mechanism)"
    attributes:
      category: "Security"
      access: "RW"

  - id: 9003
    name: DLMS_SECURITY_POLICY
    type: int
    desc: "安全策略 (Security Policy: 0-No, 1-Auth, 2-Encr, 3-Both)"
    attributes:
      category: "Security"
      access: "RW"

  - id: 9004
    name: DLMS_SECURITY_SUITE
    type: int
    desc: "安全套件 (Security Suite)"
    attributes:
      category: "Security"
      access: "RW"

  - id: 9005
    name: DLMS_REPLY_HLS
    type: string
    desc: "HLS认证响应操作 (Reply to HLS)"
    attributes:
      category: "Security"
      access: "W"

  # === 策略参数 (5000-5999) ===
  - id: 5001
    name: IEMS_BATTERY_MAX_SOC
    type: float
    unit: "%"
    desc: "IEMS电池最高SOC限制"
    attributes: { access: "RW", group: "Policy" }

  - id: 5002
    name: IEMS_BATTERY_MIN_SOC
    type: float
    unit: "%"
    desc: "IEMS电池最低SOC限制"
    attributes: { access: "RW", group: "Policy" }

  - id: 5003
    name: IEMS_GRID_LIMIT_W
    type: float
    unit: "W"
    desc: "IEMS并网功率上限"
    attributes: { access: "RW", group: "Policy" }

  # === 系统健康与监控 (11000-11999) ===
  - id: 11001
    name: SYS_NETBUF_TOTAL
    type: int
    desc: "总线缓冲区总量"
  - id: 11002
    name: SYS_NETBUF_FREE
    type: int
    desc: "总线当前可用缓冲区"
  - id: 11003
    name: SYS_NETBUF_PEAK
    type: int
    desc: "总线缓冲区使用峰值"
  - id: 11004
    name: SYS_NETBUF_LEAK_RECLAIM
    type: int
    desc: "累计强制回收的泄漏缓冲区数"