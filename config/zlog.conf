[global]
strict init = true
buffer min = 1024
reload conf period = 0
file perms = 0640

[formats]
edge_fmt = "%d(%Y-%m-%d %H:%M:%S.%ms) [%p] [%c] %m%n"

[rules]
core.*        >stdout; edge_fmt
io.*          >stdout; edge_fmt
bus.*         >stdout; edge_fmt
driver.*      >stdout; edge_fmt
proto.*       >stdout; edge_fmt
scheduler.*   >stdout; edge_fmt
storage.*     >stdout; edge_fmt
security.*    >stdout; edge_fmt
*.*           >stdout; edge_fmt