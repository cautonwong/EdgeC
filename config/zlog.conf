[global]
strict init = true
buffer min = 1024
reload conf period = 0
file perms = 0640

[formats]
edge_fmt = "%d(%Y-%m-%d %H:%M:%S.%ms) [%p] [%c] %m%n"

[rules]
core.*        >stdout; edge_fmt
io.*          "logs/io.log", 5MB * 3; edge_fmt
bus.*         "logs/bus.log", 10MB * 5; edge_fmt
driver.*      "logs/driver.log", 20MB * 10; edge_fmt
proto.*       "logs/proto.log", 5MB * 3; edge_fmt
scheduler.*   "logs/sched.log", 5MB * 3; edge_fmt
storage.*     "logs/storage.log", 10MB * 5; edge_fmt
security.*    "logs/security.log", 10MB * 10; edge_fmt

# Fallback for core and others
*.*           "logs/core.log", 10MB * 5; edge_fmt
