<!DOCTYPE html>
<html lang="en" class="h-full bg-[#030712]">
<head>
    <meta charset="UTF-8">
    <title>EdgeOS Commander | Industrial HMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item-active { background: linear-gradient(90deg, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 100%); border-left: 4px solid #0ea5e9; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
    </style>
</head>
<body class="h-full text-slate-300" x-data="app()">
    <div class="flex h-full overflow-hidden">
        <!-- Modern Sidebar -->
        <aside class="w-72 bg-[#0b0f1a] flex flex-col border-r border-white/5 shadow-2xl z-20">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center shadow-[0_0_20px_rgba(14,165,233,0.4)]">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <span class="text-2xl font-extrabold tracking-tighter text-white">EDGE<span class="text-sky-500">OS</span></span>
                </div>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] ml-1">Industrial Control v2.2</p>
            </div>

            <nav class="flex-1 px-4 space-y-1 mt-4">
                <template x-for="item in ['dashboard', 'points', 'analytics', 'settings']">
                    <button @click="tab = item" 
                        :class="tab === item ? 'sidebar-item-active text-white' : 'text-slate-500 hover:text-slate-300 hover:bg-white/5'"
                        class="w-full flex items-center gap-4 px-6 py-4 rounded-xl transition-all duration-300 group">
                        <div class="w-5 h-5 opacity-50 group-hover:opacity-100" x-html="getIcon(item)"></div>
                        <span class="text-sm font-semibold capitalize" x-text="item"></span>
                    </button>
                </template>
            </nav>

            <div class="p-6 bg-[#080c14]/50 border-t border-white/5">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Node Status</span>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full animate-pulse" :class="connected ? 'bg-emerald-500 shadow-[0_0_10px_#10b981]' : 'bg-rose-500'"></div>
                        <span class="text-[10px] font-bold" :class="connected ? 'text-emerald-500' : 'text-rose-500'" x-text="connected ? 'ONLINE' : 'OFFLINE'"></span>
                    </div>
                </div>
                <div class="space-y-3">
                    <div class="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                        <div class="h-full bg-sky-500 transition-all duration-1000" :style="`width: ${connected ? 100 : 0}%`"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-[#0f172a] via-[#030712] to-[#030712]">
            
            <!-- Global Header -->
            <header class="h-20 flex items-center px-10 justify-between border-b border-white/5 backdrop-blur-md sticky top-0 z-10">
                <div>
                    <h2 class="text-xl font-bold text-white capitalize" x-text="tab"></h2>
                    <p class="text-xs text-slate-500 font-medium">Monitoring Node: <span class="text-slate-400 font-mono">edge-node-01</span></p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">System Time</span>
                        <span class="text-sm font-mono text-slate-300" x-text="serverTime"></span>
                    </div>
                    <button @click="ota()" class="group relative px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-all border border-white/10 overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-sky-500/20 to-transparent translate-x-[-100%] group-hover:translate-x-0 transition-transform duration-500"></div>
                        <span class="relative text-xs font-bold tracking-wider">DEPLOY OTA (S7)</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-auto p-10">                
                <!-- Tab: Dashboard -->
                <div x-show="tab === 'dashboard'" x-transition class="space-y-8">
                    <!-- Top Metrics -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <template x-for="m in metricCards">
                            <div class="glass-card p-6 rounded-3xl group hover:shadow-[0_20px_50px_rgba(0,0,0,0.3)] transition-all duration-500">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="p-3 bg-white/5 rounded-2xl group-hover:bg-sky-500/10 transition-colors" x-html="m.icon"></div>
                                    <span class="text-[10px] font-bold text-slate-500" x-text="m.trend"></span>
                                </div>
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1" x-text="m.label"></div>
                                <div class="flex items-baseline gap-2">
                                    <span class="text-3xl font-mono font-bold text-white tracking-tighter" x-text="m.value"></span>
                                    <span class="text-sm font-bold text-slate-600" x-text="m.unit"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Main Chart Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 glass-card p-8 rounded-[2rem] shadow-2xl">
                            <div class="flex items-center justify-between mb-8">
                                <h3 class="text-lg font-bold text-white flex items-center gap-3">
                                    <div class="w-2 h-6 bg-sky-500 rounded-full"></div>
                                    Real-time Power Dynamics (S1)
                                </h3>
                                <div class="flex gap-2">
                                    <div class="px-3 py-1 bg-sky-500/10 text-sky-500 text-[10px] font-bold rounded-lg border border-sky-500/20">LIVE FEED</div>
                                </div>
                            </div>
                            <div class="h-[350px]">
                                <canvas id="realtimeChart"></canvas>
                            </div>
                        </div>

                        <!-- Control Card -->
                        <div class="glass-card p-8 rounded-[2rem] flex flex-col">
                            <h3 class="text-lg font-bold text-white mb-8 flex items-center gap-3">
                                <div class="w-2 h-6 bg-rose-500 rounded-full"></div>
                                Active Control (S6)
                            </h3>
                            
                            <div class="space-y-10 flex-1">
                                <div class="space-y-4">
                                    <div class="flex justify-between">
                                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Grid Power Limit</span>
                                        <span class="text-sm font-mono font-bold text-sky-500" x-text="limit + '%'"></span>
                                    </div>
                                    <input type="range" x-model="limit" @change="sendControl(1001, $el.value)" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500">
                                </div>

                                <div class="space-y-4">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block">System Override</span>
                                    <button @click="emergencyStop()" class="w-full py-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 border border-rose-500/30 rounded-2xl font-bold text-xs tracking-[0.2em] transition-all">
                                        EMERGENCY SHUTDOWN
                                    </button>
                                </div>
                            </div>

                            <div class="mt-8 pt-8 border-t border-white/5 space-y-4 font-mono text-[10px] text-slate-500 uppercase">
                                <div class="flex justify-between"><span>Last Heartbeat</span><span x-text="lastUpdate"></span></div>
                                <div class="flex justify-between"><span>Uptime</span><span x-text="uptime + 's'"></span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Points -->
                <div x-show="tab === 'points'" x-transition class="glass-card rounded-[2rem] overflow-hidden border border-white/5">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-white/[0.02] text-slate-500 uppercase text-[10px] font-black tracking-[0.2em]">
                                <th class="p-8">Register ID</th>
                                <th>Telemetry Name</th>
                                <th>Protocol</th>
                                <th>Bus ID</th>
                                <th class="text-right p-8">Operations</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5 font-medium text-sm">
                            <template x-for="p in points">
                                <tr class="hover:bg-white/[0.02] transition-colors group">
                                    <td class="p-8 font-mono text-sky-500" x-text="p.id"></td>
                                    <td class="text-white" x-text="p.name"></td>
                                    <td><span class="px-3 py-1 bg-slate-800 rounded-lg text-[10px]" x-text="p.proto"></span></td>
                                    <td class="font-mono text-slate-500">RS485_0</td>
                                    <td class="text-right p-8">
                                        <button @click="forceRead(p.id)" class="text-xs text-sky-500 font-bold opacity-0 group-hover:opacity-100 transition-opacity hover:underline">ON-DEMAND READ (S5)</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API = 'http://' + window.location.hostname + ':8081';
        let chartInstance = null;

        function app() {
            return {
                tab: 'dashboard', connected: false, volt: 0, points: [], limit: 75, uptime: 0, lastUpdate: 'N/A', serverTime: '--:--:--',
                metricCards: [
                    { label: 'Phase A Voltage', value: '0.0', unit: 'V', trend: '+0.2%', icon: '<svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>' },
                    { label: 'Active Current', value: '0.0', unit: 'A', trend: '-1.5%', icon: '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>' },
                    { label: 'Frequency', value: '50.01', unit: 'Hz', trend: 'STABLE', icon: '<svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>' },
                    { label: 'Node Temp', value: '42', unit: '°C', trend: 'NORMAL', icon: '<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' }
                ],
                init() {
                    setInterval(() => { this.serverTime = new Date().toLocaleTimeString(); }, 1000);
                    this.$nextTick(() => { this.initChart(); });
                    this.connect();
                    this.fetchPoints();
                },
                initChart() {
                    const ctx = document.getElementById('realtimeChart').getContext('2d');
                    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(14, 165, 233, 0.3)');
                    gradient.addColorStop(1, 'rgba(14, 165, 233, 0)');
                    
                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: { labels: Array(30).fill(''), datasets: [{ label: 'Voltage (V)', data: Array(30).fill(220), borderColor: '#0ea5e9', borderWidth: 3, pointRadius: 0, fill: true, backgroundColor: gradient, tension: 0.4 }] },
                        options: { 
                            maintainAspectRatio: false, 
                            plugins: { legend: { display: false } },
                            scales: { 
                                x: { display: false },
                                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } } }
                            }
                        }
                    });
                },
                connect() {
                    const es = new EventSource(API + '/events');
                    es.onmessage = (e) => {
                        this.connected = true;
                        const msg = JSON.parse(e.data);
                        if(msg.type === 'telemetry') {
                            this.volt = msg.val;
                            this.metricCards[0].value = msg.val.toFixed(1);
                            this.metricCards[1].value = (msg.val / 20).toFixed(2);
                            this.uptime++;
                            this.lastUpdate = new Date().toLocaleTimeString();
                            this.updateChart(msg.val);
                        }
                    };
                    es.onerror = () => { this.connected = false; };
                },
                updateChart(val) {
                    if(!chartInstance) return;
                    chartInstance.data.datasets[0].data.push(val);
                    chartInstance.data.datasets[0].data.shift();
                    chartInstance.update('none');
                },
                getIcon(tab) {
                    const icons = {
                        dashboard: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>',
                        points: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>',
                        analytics: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>',
                        settings: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>'
                    };
                    return icons[tab];
                },
                async fetchPoints() { try { const r = await fetch(API + '/api/v1/points'); this.points = await r.json(); } catch(e){} },
                async sendControl(id, val) { await fetch(API + '/api/v1/control/write', { method:'POST', body:JSON.stringify({tag_id:id, value:parseFloat(val)}) }); },
                async forceRead(id) { await fetch(API + '/api/v1/control/read', { method:'POST', body:JSON.stringify({tag_id:id}) }); },
                async ota() { if(confirm('Deploy firmware update to all nodes? This will lock the bus.')) await fetch(API + '/api/v1/control/ota/start', { method:'POST' }); },
                emergencyStop() { alert('EMERGENCY STOP TRIGGERED'); }
            }
        }
    </script>
</body>
</html>
