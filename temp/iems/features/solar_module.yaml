# Solar Modular Feature
protocol: "MODBUS"
mappings:
  - tag: SOLAR_VOLTAGE
    addr: 0x0100
    scale: 0.1

scenarios:
  - "scenarios/solar_test.yaml"
  - "scenarios/composition_test.yaml"

enabled_tags:
  - tag: SOLAR_VOLTAGE
    attributes:
      poll_interval_ms: 1000
  - tag: SOLAR_RELAY
    attributes:
      access: "RW"
