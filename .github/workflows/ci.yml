name: EdgeOS CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Linux x86_64",
              os: ubuntu-22.04,
              target: x86_64,
              cc: gcc,
              cxx: g++,
              cmake_args: "-DENABLE_COVERAGE=ON",
              run_tests: true,
              use_qemu: false
            }
          - {
              name: "Linux arm64 (Cross)",
              os: ubuntu-22.04,
              target: arm64,
              cc: aarch64-linux-gnu-gcc,
              cxx: aarch64-linux-gnu-g++,
              cmake_args: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake",
              run_tests: true,
              use_qemu: true,
              qemu_exec: qemu-aarch64-static
            }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format lcov libssl-dev

      - name: Install Cross-Compilation Tools
        if: matrix.config.target == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static

      - name: Check Formatting (x86 only)
        if: matrix.config.target == 'x86_64'
        run: |
          find src include tests -name "*.[ch]" | xargs clang-format -n --Werror

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            ${{ matrix.config.cmake_args }}
          
      - name: Build
        run: cmake --build build

      - name: Run Unit Tests (Native)
        if: matrix.config.run_tests && !matrix.config.use_qemu
        run: |
          cd build
          ctest --output-on-failure

      - name: Run Unit Tests (QEMU)
        if: matrix.config.run_tests && matrix.config.use_qemu
        run: |
          cd build
          # Manually run tests via QEMU since ctest integration can be complex with static libs and paths
          # We search for test binaries in the tests/ directory
          for t in tests/test_*; do
            if [ -x "$t" ]; then
              echo "Running $t via ${{ matrix.config.qemu_exec }}"...
              ${{ matrix.config.qemu_exec }} -L /usr/aarch64-linux-gnu/ "$t"
            fi
          done

      - name: Generate Coverage Report (x86 only)
        if: matrix.config.target == 'x86_64'
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/vendor/*' --output-file coverage_clean.info
          lcov --list coverage_clean.info