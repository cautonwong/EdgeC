name: EdgeOS CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # Job 1: Build & Unit Test (Matrix with ASan/TSan)
  # ==========================================
  build-and-test:
    name: Build & Test (${{ matrix.config.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { target: x86_64, cc: gcc, cxx: g++, cmake_args: "-DCOVERAGE=ON", run_tests: true }
          - { target: x86_64_asan, cc: gcc, cxx: g++, cmake_args: "-DENABLE_ASAN=ON", run_tests: true }
          - { target: x86_64_tsan, cc: gcc, cxx: g++, cmake_args: "-DENABLE_TSAN=ON", run_tests: true }
          - { target: x86_64_ubsan, cc: gcc, cxx: g++, cmake_args: "-DENABLE_UBSAN=ON", run_tests: true }
          # #416: optional distributed backends compiled out must still link.
          - { target: x86_64_trimmed, cc: gcc, cxx: g++, cmake_args: "-DCONF_FILE=${GITHUB_WORKSPACE}/ci/prj_trimmed.conf", run_tests: false }
          - { target: arm64, cc: aarch64-linux-gnu-gcc, cxx: aarch64-linux-gnu-g++, cmake_args: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake", run_tests: false }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy lcov valgrind libssl-dev
          if [ "${{ matrix.config.target }}" == "arm64" ]; then
            sudo dpkg --add-architecture arm64
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list || true
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/^Architectures:.*/Architectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources || true
            fi
            sudo apt-get update
            sudo apt-get install -y libssl-dev:arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi



      - name: Configure & Build
        run: |
          mkdir build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release ${{ matrix.config.cmake_args }}
          cmake --build . -j$(nproc)

      - name: Run Tests (x86_64 only)
        if: matrix.config.run_tests
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/.local/linux-x86_64/lib
          cd build && ctest --output-on-failure


      - name: Generate Code Coverage (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors gcov,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/third-party/*' --output-file coverage_clean.info --ignore-errors gcov,source
          lcov --list coverage_clean.info || true

      - name: Run Go Unit Tests (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          cd go && go test ./...

      - name: Run Matrix Simulation Tests (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          ./test.sh --omnis

      - name: Run Architecture & Anti-Entropy Gates (x86_64 only)
        if: matrix.config.target == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          # run_guard_selftest exercises every guard twice: on its refutation fixture
          # (must reject) and on the live tree (must pass). Live failures compare
          # against the shrink-only ledgers in ci/baseline/ (#411).
          python3 ci/scripts/run_guard_selftest.py
          ./scripts/check_no_old_src.sh
          ./scripts/check_symbols_baseline.sh
          STRICT_CORE_GATE=1 ./scripts/check_core_symbols.sh
          STRICT_CORE_GATE=1 ./scripts/check_core_readonly.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
          ./scripts/check_binary_sizes.sh | tee build/size_report.txt

      - name: CI Log Diagnostics & Summary Analysis (Fast-DDS style)
        if: always()
        shell: bash
        run: |
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            python3 ci/scripts/ci_log_analyzer.py -i build/Testing/Temporary/LastTest.log -t "${{ matrix.config.target }}" > $GITHUB_STEP_SUMMARY || true
          fi

      - name: Generate Packages
        if: matrix.config.target != 'x86_64_asan'
        run: |
          cd build && cpack -G TGZ && cpack -G DEB

      - name: Upload Artifacts
        if: matrix.config.target != 'x86_64_asan'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: edgeos-dist-${{ matrix.config.target }}
          path: |
            build/*.tar.gz
            build/*.deb
            build/size_report.txt

  # ==========================================
  # Job 2: Multi-Product Frontend E2E Matrix (Playwright)
  # ==========================================
  frontend-e2e:
    name: Frontend E2E (${{ matrix.product }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        product: [iems, smartbox]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Python 3.12 for Contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & Playwright Browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cd web
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Compile Contracts & Generate Frontend Types
        run: |
          python3 -m pip install jinja2 pyyaml
          mkdir -p build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Debug -DENABLE_UI=ON
          ninja generated_contracts || true

      - name: Run Multi-Product E2E Tests (${{ matrix.product }})
        run: |
          cd web
          npm run test:e2e:${{ matrix.product }}

      - name: Upload Playwright Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.product }}
          path: web/playwright-report/
          retention-days: 14

  # ==========================================
  # Job 3: AI-Augmented Code Review & Quality Gate (Orchestrator)
  # ==========================================
  ai-code-review-gate:
    name: AI Quality Gate & Orchestrator
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup System Linters & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck python3-pip
          pip3 install mcp
          sudo ln -sf $(pwd)/scripts/ci/code_review_graph.py /usr/local/bin/code-review-graph

      - name: Run Review Orchestration & Synthesize Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > changed_files.txt || git diff --name-only HEAD~1...HEAD > changed_files.txt
          python3 scripts/ci/code_review_graph.py build
          PYTHONPATH=scripts/ci python3 scripts/ci/run_pure_mcp_orchestrator.py

      - name: Render GitHub Step Summary
        if: always()
        run: |
          if [ -f "final_report.md" ]; then
            cat final_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR Sticky Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('final_report.md')) return;
            const content = fs.readFileSync('final_report.md', 'utf8');
            const botTag = "<!-- AI_CODE_REVIEW_STICKY_BOT -->";
            const fullBody = `${botTag}\n${content}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(botTag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody
              });
            }

      - name: Quality Gate Status Enforcement
        run: |
          python3 -c '
          import json, sys
          with open("final_report.json") as f:
              data = json.load(f)
          p0 = data.get("summary", {}).get("P0", 0)
          p1 = data.get("summary", {}).get("P1", 0)
          print(f"::notice::AI 质量门禁指标: P0={p0}, P1={p1}")
          if p0 > 0:
              print(f"::error::质量门禁拦截：检测到 {p0} 个 P0 阻断级缺陷，禁止合并！")
              sys.exit(1)
          '

  # ==========================================
  # Job 4: Docker Build & Push
  # ==========================================
  docker-publish:
    name: Build & Push Docker Image
    needs: [build-and-test, frontend-e2e, ai-code-review-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 4: GitHub Release
  # ==========================================
  release:
    name: Create Release
    needs: [build-and-test, frontend-e2e, ai-code-review-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.deb" -exec cp {} dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
