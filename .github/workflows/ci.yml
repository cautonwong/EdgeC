name: EdgeOS CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate-x86:
    name: Code Quality & Coverage (x86_64)
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format clang-tidy lcov unzip wget libssl-dev

      - name: Build Hermetic Vendors (x86_64)
        run: ./build_vendors.sh

      - name: Check Formatting
        run: |
          find src include tests -name "*. [ch]" | xargs clang-format -n --Werror

      - name: Configure CMake (Debug + Coverage + Tidy)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DENABLE_CLANG_TIDY=ON
          
      - name: Build
        run: cmake --build build

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage.info
          # Remove vendor/system libs from report
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/vendor/*' --output-file coverage_clean.info
          lcov --list coverage_clean.info

  cross-compile-arm64:
    name: Cross Compile Check (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Cross Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build

      # In real scenario, we might use QEMU to build vendors or download prebuilts.
      # For now, we simulate vendor availability or build what we can.
      # Since we don't have qemu setup here for build_vendors.sh execution of compiled binaries,
      # we assume we can cross-compile static libs.
      
      # We need a cross-compile toolchain file.
      - name: Create Toolchain File
        run: |
          echo "set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)" > aarch64-toolchain.cmake

      # Note: build_vendors.sh currently builds for host. 
      # We would need to adjust it to support cross-compilation argument 
      # or run it inside a docker container with qemu user static.
      # For this CI check, we skip full build if vendors are missing, 
      # or we enhance build_vendors to cross-compile.
