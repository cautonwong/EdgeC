name: EdgeOS CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Code Quality & Coverage
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format clang-tidy lcov unzip wget libssl-dev

      - name: Build Hermetic Vendors
        # This builds sqlite3, cmocka, libuv, cjson into .local/linux-x86_64
        run: ./build_vendors.sh

      - name: Check Formatting
        run: |
          find src include tests -name "*.[ch]" | xargs clang-format -n --Werror

      - name: Configure CMake (Debug + Coverage + Tidy)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DENABLE_CLANG_TIDY=ON
          
      - name: Build
        run: cmake --build build

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage.info
          # Remove vendor/system libs from report
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/vendor/*' --output-file coverage_clean.info
          lcov --list coverage_clean.info