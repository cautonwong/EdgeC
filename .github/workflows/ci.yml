# .github/workflows/ci.yml
#
# C-EdgeX Continuous Integration Workflow
#
# This workflow uses a Dockerized build environment to ensure reproducible builds.
# It performs the following checks on every push to `main` or pull request:
#   1. Builds and tests the project for x64 (Debug and Release).
#   2. Cross-compiles the project for ARM64.
#   3. Runs static analysis using cppcheck.
#   4. Runs memory analysis using valgrind.

name: C-EdgeX CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-x64:
    name: Build & Test (x64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [x64-debug, x64-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t c-edgex-builder-x64 -f build_env/Dockerfile.x64 .

      - name: Configure Project
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          cmake --build build/${{ matrix.preset }} -j$(nproc)

      - name: Run Tests (Debug only)
        if: matrix.preset == 'x64-debug'
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          ctest --preset ${{ matrix.preset }}

  cross-compile-arm64:
    name: Cross-Compile (ARM64)
    runs-on: ubuntu-latest
    needs: build-and-test-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Base x64 Image
        run: docker build -t c-edgex-builder-x64 -f build_env/Dockerfile.x64 .

      - name: Build ARM64 Cross-Compiler Image
        run: docker build -t c-edgex-builder-arm64 -f build_env/Dockerfile.arm64 .

      - name: Configure Project
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-arm64 \
          cmake --preset arm64-release

      - name: Build Project
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-arm64 \
          cmake --build build/arm64-release -j$(nproc)

      - name: Archive ARM64 Binary
        uses: actions/upload-artifact@v3
        with:
          name: sim_sensor_app-arm64
          path: ${{ github.workspace }}/build/arm64-release/bin/sim_sensor_app

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    needs: build-and-test-x64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Build Docker Image
        run: docker build -t c-edgex-builder-x64 -f build_env/Dockerfile.x64 .
        
      - name: Run cppcheck
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem platform/sdk/src products/sim_sensor_app

  memory-analysis:
    name: Memory Analysis (valgrind)
    runs-on: ubuntu-latest
    needs: build-and-test-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t c-edgex-builder-x64 -f build_env/Dockerfile.x64 .

      - name: Configure Project for Release Build (no ASan)
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          cmake --preset x64-release
          
      - name: Build Project
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          cmake --build build/x64-release

      - name: Run tests under Valgrind
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) \
          c-edgex-builder-x64 \
          valgrind --leak-check=full --error-exitcode=1 build/x64-release/platform/tests/sdk_tests
