name: EdgeOS CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Unit Test (Matrix with ASan/TSan)
  # ==========================================
  build-and-test:
    name: Build & Test (${{ matrix.config.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { target: x86_64, cc: gcc, cxx: g++, cmake_args: "-DCOVERAGE=ON", run_tests: true }
          - { target: x86_64_asan, cc: gcc, cxx: g++, cmake_args: "-DENABLE_ASAN=ON", run_tests: true }
          - { target: x86_64_tsan, cc: gcc, cxx: g++, cmake_args: "-DENABLE_TSAN=ON", run_tests: true }
          - { target: arm64, cc: aarch64-linux-gnu-gcc, cxx: aarch64-linux-gnu-g++, cmake_args: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake", run_tests: false }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy lcov valgrind libssl-dev
          if [ "${{ matrix.config.target }}" == "arm64" ]; then
            sudo dpkg --add-architecture arm64
            cat << 'EOF' | sudo tee /etc/apt/sources.list.d/arm64.list
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
EOF
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list || true
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/^Architectures:.*/Architectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources || true
            fi
            sudo apt-get update
            sudo apt-get install -y libssl-dev:arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi



      - name: Configure & Build
        run: |
          mkdir build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release ${{ matrix.config.cmake_args }}
          cmake --build . -j$(nproc)

      - name: Run Tests (x86_64 only)
        if: matrix.config.run_tests
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/.local/linux-x86_64/lib
          cd build && ctest --output-on-failure


      - name: Generate Code Coverage (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors gcov,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/third-party/*' --output-file coverage_clean.info --ignore-errors gcov,source
          lcov --list coverage_clean.info || true

      - name: Run Go Unit Tests (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          cd go && go test ./...

      - name: Run Matrix Simulation Tests (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          ./test.sh --omnis

      - name: Run Architecture & Anti-Entropy Gates (x86_64 only)
        if: matrix.config.target == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check_no_old_src.sh
          ./scripts/check_symbols_baseline.sh
          STRICT_CORE_GATE=1 ./scripts/check_core_symbols.sh
          STRICT_CORE_GATE=1 ./scripts/check_core_readonly.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
          ./scripts/check_binary_sizes.sh | tee build/size_report.txt

      - name: Generate Packages
        if: matrix.config.target != 'x86_64_asan'
        run: |
          cd build && cpack -G TGZ && cpack -G DEB

      - name: Upload Artifacts
        if: matrix.config.target != 'x86_64_asan'
        uses: actions/upload-artifact@v4
        with:
          name: edgeos-dist-${{ matrix.config.target }}
          path: |
            build/*.tar.gz
            build/*.deb
            build/size_report.txt

  # ==========================================
  # Job 2: Docker Build & Push
  # ==========================================
  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 3: GitHub Release
  # ==========================================
  release:
    name: Create Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find artifacts -name "*.deb" -exec cp {} dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
