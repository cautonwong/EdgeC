name: EdgeOS CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Linux x86_64",
              os: ubuntu-22.04,
              target: x86_64,
              cc: gcc,
              cxx: g++,
              cmake_args: "-DENABLE_COVERAGE=ON",
              run_tests: true,
              use_qemu: false
            }
          - {
              name: "Linux arm64 (Cross)",
              os: ubuntu-22.04,
              target: arm64,
              cc: aarch64-linux-gnu-gcc,
              cxx: aarch64-linux-gnu-g++,
              cmake_args: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake",
              run_tests: true,
              use_qemu: true,
              qemu_exec: qemu-aarch64-static
            }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: tools/contract-compiler/go.sum

      - name: Ccache Setup
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.name }}

      - name: Fix Binary Permissions
        run: |
          chmod +x .local/linux-x86_64/bin/contract-compiler || true
          chmod +x .local/linux-aarch64/bin/contract-compiler || true

      - name: Install Testing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-format clang-tidy lcov libssl-dev valgrind jq

      - name: Static Analysis (x86_64 only)
        if: matrix.config.target == 'x86_64'
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache
          run-clang-tidy -p . -j $(nproc) -header-filter='src/.*' -checks='-*,bugprone-*,cert-*,performance-*'

      - name: Run Unit Tests (Native)
        if: matrix.config.run_tests && !matrix.config.use_qemu
        run: |
          cd build
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/.local/linux-x86_64/lib
          ctest --output-on-failure

      - name: Valgrind Deep Memory Check (x86 only)
        if: matrix.config.target == 'x86_64'
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/.local/linux-x86_64/lib
          valgrind --leak-check=full --error-exitcode=1 ./build/tests/test_datahub
          valgrind --leak-check=full --error-exitcode=1 ./build/tests/test_shmring

      - name: Full Product Smoke Test (x86 only)
        if: matrix.config.target == 'x86_64'
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/.local/linux-x86_64/lib
          ./scripts/smoke_test.sh iems
          ./scripts/smoke_test.sh dcu
          ./scripts/smoke_test.sh evse
          ./scripts/smoke_test.sh sg
          ./scripts/smoke_test.sh hems

      - name: Run Unit Tests (QEMU)
        if: matrix.config.run_tests && matrix.config.use_qemu
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cd build
          # Manually run tests via QEMU
          # We pass the local lib path to the guest LD_LIBRARY_PATH
          for t in tests/test_*; do
            if [ -x "$t" ]; then
              echo "Running $t via ${{ matrix.config.qemu_exec }}"...
              ${{ matrix.config.qemu_exec }} -L /usr/aarch64-linux-gnu/ \
                -E LD_LIBRARY_PATH=${{ github.workspace }}/.local/linux-aarch64/lib \
                "$t"
            fi
          done

      - name: Generate Coverage Report (x86 only)
        if: matrix.config.target == 'x86_64'
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/vendor/*' --output-file coverage_clean.info
          lcov --list coverage_clean.info

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeOS-Package-${{ matrix.config.target }}
          path: |
            build/EdgeOS-*.deb
            build/EdgeOS-*.tar.gz
          if-no-files-found: warn

      - name: Upload Coverage (x86 only)
        if: matrix.config.target == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeOS-Coverage
          path: build/coverage_clean.info
