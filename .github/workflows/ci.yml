name: C-EdgeX CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-app:
    name: Build Application (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Build and Run
        run: |
          ./build.sh --preset x64-release
          ls -l build/x64-release/bin
