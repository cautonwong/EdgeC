# iems 用例引用的条款。
#
# 平台包里那份是电力行业条款(DL/T 645 / GB/T 34131 / GB/T 37408),没有
# "采集网关轮询"的条款。项目自己声明一份,summary 写这组用例测什么,
# 不是标准原文。
clauses:
  IEMS-ACQ-1: {standard: "EdgeC iems", number: "ACQ-1", summary: "南向总线上的表值必须真的被读回并落到 iems 的实时数据接口上"}
  IEMS-ACQ-2: {standard: "EdgeC iems", number: "ACQ-2", summary: "轮询必须周期性发生,不是启动时发一帧就停"}
  IEMS-SVC-1: {standard: "EdgeC iems", number: "SVC-1", summary: "服务起来后 REST 健康检查可用,且监听在指定端口"}
  IEMS-KNOWN-GAP-1: {standard: "EdgeC iems", number: "KNOWN-GAP-1", summary: "已知缺口记录:产物侧无数据源时 REST 仍返回 0 而不是报缺失(升级时改判据)"}
  IEMS-ACQ-3: {standard: "EdgeC iems", number: "ACQ-3", summary: "北向从站发布的镜像必须与南向读到的值一致,不是恒 0"}
  IEMS-SVC-2: {standard: "EdgeC iems", number: "SVC-2", summary: "配了南向总线却一路上都连不上时,产品必须在启动阶段失败,不许进入重连循环"}
  IEMS-ROBUST-1: {standard: "EdgeC iems", number: "ROBUST-1", summary: "CRC 校验失败的应答必须整帧丢弃,载荷不许变成读数"}
  IEMS-ROBUST-2: {standard: "EdgeC iems", number: "ROBUST-2", summary: "应答超时不许把 0 写成读数;下一轮必须恢复到正确值"}
  IEMS-LINK-1: {standard: "EdgeC iems", number: "LINK-1", summary: "南向链路断开后必须停止发布新数据(时间戳不再前进),不许把旧值或 0 当新读数,进程不许退出且服务仍可用"}
  IEMS-ROBUST-3: {standard: "EdgeC iems", number: "ROBUST-3", summary: "部分南向总线连不上时产品仍可启动,但必须在启动汇总行里说清哪几路没连上(不许静默降级)"}
  IEMS-ROBUST-4: {standard: "EdgeC iems", number: "ROBUST-4", summary: "应答慢于轮询时(低于或真实超过事务超时),迟到应答必须被排空,不许被下一个事务当成本事务的应答解码(Modbus RTU 读应答无寄存器地址,串了就是串 tag)"}
  IEMS-CTRL-1: {standard: "EdgeC iems", number: "CTRL-1", summary: "北向控制写必须按 poll_tasks/inventory 路由到点位所在的南向从站;没有唯一路由的写必须被拒绝,不许回显成功"}
  IEMS-NB-IEC104: {standard: "EdgeC iems", number: "NB-IEC104", summary: "北向 IEC104 从站:STARTDT/TESTFR 应答、总召 ACT_CON→数据→ACT_TERM、不支持的 QOI/CA 与未映射命令必须回对应的负确认、畸形 APCI 不许让进程倒下、点值变化必须自发上报 COT=3"}
  IEMS-NB-UDS-1: {standard: "EdgeC iems", number: "NB-UDS-1", summary: "北向 UDS 从站生命周期:断开必须释放 io 句柄(进程 fd 不随连接次数增长);单客户端语义,第二路并发连接必须被关闭且不影响第一路读数"}
  IEMS-TRANSPORT-UART: {standard: "EdgeC iems", number: "TRANSPORT-UART", summary: "南向真实 UART:产品按 /dev/ 路径与 OMNIS_BUS_n_BAUD 打开设备并在其上完成 RTU 采集,采集值落到 REST,北向写下发为南向 FC06 单寄存器写"}
  IEMS-TRANSPORT-TCP: {standard: "EdgeC iems", number: "TRANSPORT-TCP", summary: "南向 tcp:// 传输:产品主动建立 TCP 连接,在同一连接上按 RTU 帧收发(不是 MBAP),采集值落到 REST,北向写下发为南向 FC06 单寄存器写"}
  IEMS-TRANSPORT-MBAP: {standard: "EdgeC iems", number: "TRANSPORT-MBAP", summary: "南向 Modbus TCP(inventory.protocol=ModbusTCP):产品按 7 字节 MBAP 头收发、无 CRC 的 PDU,采集值落到 REST,北向写下发为南向 MBAP FC06 单寄存器写"}
  IEMS-TRANSPORT-TCP-RECONNECT: {standard: "EdgeC iems", number: "TRANSPORT-TCP-RECONNECT", summary: "南向 TCP 断链后必须按退避重连:日志出现 connection lost/retry 与第二次 CONNECTED,进程不重启(PID 不变、restarts.json 为空),重连后周期轮询恢复且 REST 时间戳继续前进"}
  IEMS-RESTART-1: {standard: "EdgeC iems", number: "RESTART-1", summary: "产品重启:优雅退出(3 秒内、退出码 0),新 MQTT 会话重发 BIRTH,REST 与北向镜像恢复最后一次采集值且 WAL 回放条数大于 0"}
  IEMS-RESTART-2: {standard: "EdgeC iems", number: "RESTART-2", summary: "产品被 SIGKILL(无收尾)后重启:必须回放 WAL 恢复最后一次采集值(回放条数大于 0),重连南向总线继续周期轮询,新 MQTT 会话重发 BIRTH"}
