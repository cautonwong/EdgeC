# DCU 北向（族 B，DL/T 698.45）验收用的设备清单。
#
# 为什么与 devices.yaml 分开：平台的 `meter` fixture 会按清单里**每台** meter 各展开
# 一次用例。南向那张表(bench_meter_01)和北向这台(dcu_north_01)混在一份清单里，
# "读档案计数"这条就会跑到 645 电表上、报 KeyError —— 失败原因和被测对象无关。
# 一份清单一台 DUT，是这套台架一直的约定。
#
# 链路：dcu_product.py 把 DCU 的 unix socket 桥成 127.0.0.1:19212，
# 平台按 access: tcp 连上去问属性（平台的传输层只认 serial/tcp，不认 unix socket）。
criteria_profiles:
  dcu_698_live:
    - quantity: 档案计数
      min: 1
      max: 64
    - quantity: 任务方案数
      min: 1
      max: 16
    - quantity: 日冻结记录数
      min: 0
      max: 65535

models:
  dcu_698_image:
    type: meter
    protocol: dlt698
    criteria: dcu_698_live
    capabilities: [档案计数, 任务方案数, 日冻结记录数]
    # 变量类（2000/2001/2004 等）按标准返回数组，平台点表只列标量；数组形状
    # 由 test_dcu_northbound.py 直接解析 APDU 验证。
    point_table:
      档案计数:
        address: "60000200"
        length: 2
        encoding: uint
        scale: 1
        byteorder: big
        unit: 只
      任务方案数:
        address: "60120200"
        length: 2
        encoding: uint
        scale: 1
        byteorder: big
        unit: 个
      日冻结记录数:
        address: "50040200"
        length: 2
        encoding: uint
        scale: 1
        byteorder: big
        unit: 条

devices:
  - id: dcu_north_01
    model: dcu_698_image
    role: dut
    access: tcp
    bus_address: 1
    connection:
      host: 127.0.0.1
      port: 19212
