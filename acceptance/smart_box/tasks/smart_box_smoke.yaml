# 任务文件:smart_box 只有冒烟,没有验收。
#
# 为什么不是 acceptance:智能盒子的被测面是 HTTP + sqlite,没有字节流设备可挂证据
# (平台的证据层只认字节流规约)。硬标成 acceptance,报告永远是"设备级 0/0 未完成"。
#
# launch 里必须有 ${PORT}:平台的就绪探针要 TCP connect 到它。网关自己认
# GATEWAY_PORT 环境变量,不认 --port,所以由产品壳 gateway.py 转换。
id: smart_box-smoke
kind: smoke
product: smart-box-gateway
launch:
  - ${PYTHON}
  - gateway.py
  - --port
  - ${PORT}
devices: configs/devices.yaml
select: tag:冒烟
