\* Positive bounds for Arbiter.tla. Constants are the proof scope; the model
\* reads them from here, never from prose. LateBound < Timeout is the stated
\* assumption (see ASSUME in the module and docs/evidence/FORMAL-P1/residual.md).
CONSTANTS
    Cmds = {1, 2}
    Priorities = {0, 1, 2}
    Timeout = 2
    LateBound = 1
    MaxQueue = 2
    MaxTime = 6
    RecoveryGate = TRUE

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoDoubleSettle
INVARIANT NoDispatchWhileOwner
INVARIANT NoDispatchInRecovery
INVARIANT LateResponseNotAssignedToNext
