\* Negative variant: same model, only RecoveryGate flipped. The dispatch guard
\* no longer honours recovery_until_ns, so a next command can go on the wire
\* before the timed-out transaction's response has landed.
CONSTANTS
    Cmds = {1, 2}
    Priorities = {0, 1, 2}
    Timeout = 2
    LateBound = 1
    MaxQueue = 2
    MaxTime = 6
    RecoveryGate = FALSE

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoDoubleSettle
INVARIANT NoDispatchWhileOwner
INVARIANT NoDispatchInRecovery
INVARIANT LateResponseNotAssignedToNext
