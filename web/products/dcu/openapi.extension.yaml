# DCU 扩展 API（Pack OpenAPI）
openapi: 3.1.0
info:
  title: DCU Pack API
  version: 1.4.0
paths:
  /api/v1/dcu/meters:
    get:
      operationId: listDcuMeters
      summary: 电表档案列表
      security: [{ sessionCookie: [] }]
      x-required-permissions: [dcu.meter:read]
      x-resource-scope: gateway
      x-required-capabilities: [software.collector.dlt698]
      x-audit-level: none
      responses:
        "200": { description: 电表档案 }

  /api/v1/dcu/frames:
    get:
      operationId: listDcuFrames
      summary: 最近协议报文
      security: [{ sessionCookie: [] }]
      x-required-permissions: [dcu.frame:read]
      x-resource-scope: gateway
      x-audit-level: low
      responses:
        "200": { description: 报文列表 }
