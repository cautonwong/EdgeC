# iEMS Product Pack（构建输入）
#
# 依据 v1.6 §4.2 / §14.1。这里声明的每一项权限都必须能在 permissions/catalog.yaml
# 解析到；页面/接口引用的功能开关必须同时出现在 release-scope.yaml。
schemaVersion: 1
id: iems
name: iEMS 能源管理网关
version: 2.3.0
coreSdk: ^1.6.0

theme:
  brandColor: '#0B6BCB'
  logo: assets/logo.svg

# Core 模块开关：缺省即关闭。构建期据此裁剪页面，运行期不再判断"产品是否支持"。
modules:
  core:overview: { enabled: true }
  core:data: { enabled: true }
  core:control: { enabled: true }
  core:network: { enabled: true }
  core:system: { enabled: true }
  core:diagnostics: { enabled: true }

features:
  # 升级功能：是否开放由 release-scope.yaml 决定（ADR-08）。任一方关闭即不生成入口。
  firmwareUpgrade: {}

pages:
  - id: iems.telemetry
    path: /iems/telemetry
    component: pages/TelemetryOverview.vue
    title: 能流概览
    menu: { group: overview, order: 20, icon: bolt }
    permissions: { allOf: [iems.telemetry:read] }
    requires:
      capabilities: [software.collector.modbus]

  - id: iems.strategy
    path: /iems/strategy
    component: pages/StrategyView.vue
    title: 削峰填谷策略
    menu: { group: control, order: 40, icon: bolt }
    permissions: { allOf: [iems.strategy:read] }
    requires:
      entitlements: [iems.peak-shaving]

widgets:
  - id: iems.power-flow
    component: components/PowerFlowCard.vue
    size: { w: 6, h: 4 }
    permissions: { allOf: [iems.telemetry:read] }
    requires:
      capabilities: [software.collector.modbus]

permissions:
  - { id: iems.datapoint:read, description: 查看数据点表, sensitivity: low }
  - { id: iems.datapoint:write, description: 编辑数据点表, sensitivity: high, dependencies: [iems.datapoint:read] }
  - { id: iems.telemetry:read, description: 查看 iEMS 遥测, sensitivity: low }
  - { id: iems.strategy:read, description: 查看策略, sensitivity: medium }
  - { id: iems.strategy:write, description: 编辑策略, sensitivity: high, dependencies: [iems.strategy:read] }
  - { id: iems.cloud:read, description: 查看云连接配置, sensitivity: medium }
  - { id: iems.cloud:write, description: 修改云连接配置, sensitivity: high, dependencies: [iems.cloud:read] }

# Pack 追加到 Core 预置角色的授权（并集；不得删除 Core 权限）
rolePresets:
  viewer:
    - iems.telemetry:read
    - iems.datapoint:read
    - iems.strategy:read
  operator:
    - iems.telemetry:read
    - iems.datapoint:read
    - iems.strategy:read
    - iems.strategy:write
  engineer:
    - iems.telemetry:read
    - iems.datapoint:read
    - iems.datapoint:write
    - iems.strategy:read
    - iems.strategy:write
    - iems.cloud:read
  admin:
    - 'iems.*:*'

# 设备能力与许可声明：能力由设备可信服务上报，许可需签名校验（本仓库只做声明与门控）
capabilities:
  - hardware.network.cellular
  - hardware.io.rs485.ports
  - software.collector.modbus
  - software.collector.iec104

entitlements:
  iems.peak-shaving:
    description: 削峰填谷
    adr: null
  iems.cloud-advanced:
    description: 云连接高级功能

openapi: openapi.extension.yaml
