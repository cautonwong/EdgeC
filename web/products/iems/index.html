<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="same-origin" />
    <title>iEMS 能源管理网关</title>
    <script>
      // Read the same key as core/src/app/theme.ts before first paint.
      (function () {
        try {
          var preference = localStorage.getItem('edgeos.theme') || 'system';
          var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 首屏骨架：脚本加载前也不是白屏 -->
      <div style="padding: 24px; font-family: system-ui, sans-serif; color: #8b93a1">正在加载界面…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
