# EdgeOS Pre-commit Configuration
exclude: '(\.local/|build/|\.cache/|third_party/)'

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: bash -c 'files=( $(grep -vE "(\.local/|build/|\.cache/|third_party/)" <<< "$@") ); [ ${#files[@]} -eq 0 ] || (clang-format -i "${files[@]}" && git add "${files[@]}")' --
        language: system
        types_or: [c, header]
        stages: [commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace  # 修剪行尾空格
      - id: end-of-file-fixer    # 确保文件以换行符结尾
      - id: check-yaml           # 检查 YAML 语法
      - id: check-added-large-files # 禁止提交大文件
