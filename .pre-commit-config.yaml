# EdgeOS Pre-commit Configuration
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6 
    hooks:
      - id: clang-format
        types_or: [c, header]
        args: ["-i"] # 直接修改文件

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace  # 修剪行尾空格
      - id: end-of-file-fixer    # 确保文件以换行符结尾
      - id: check-yaml           # 检查 YAML 语法
      - id: check-added-large-files # 禁止提交大文件
