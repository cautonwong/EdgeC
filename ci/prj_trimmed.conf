# Trimmed build configuration (#416).
# Mirrors cmd/iems/prj.conf with the optional distributed backends disabled, so CI
# proves that a build without CycloneDDS / PahoMQTT still links. Keep this file in
# sync when cmd/iems/prj.conf gains a new option.
# Default EdgeC Configuration
CONFIG_EDGEC_TIER="ENTERPRISE"
CONFIG_EDGEC_HARDENING=y
CONFIG_EDGEC_RECURSIVE_MUTEX=y
CONFIG_EDGEC_ALGO_LINALG=y
CONFIG_EDGEC_ALGO_DSP=y
CONFIG_EDGEC_ALGO_AHRS=y
CONFIG_EDGEC_ALGO_VIBRA=y
CONFIG_EDGEC_SECURITY_DPI=y
CONFIG_EDGEC_SECURITY_SIGNED_LOGS=y
CONFIG_EDGEC_WASM=y
CONFIG_EDGEC_WASM_WATCHDOG=y
CONFIG_EDGEC_JS_ENGINE=y
CONFIG_EDGEC_PROTO_MODBUS=y
CONFIG_EDGEC_PROTO_IEC104=y
CONFIG_EDGEC_PROTO_SPARKPLUG_B=y
CONFIG_EDGE_INFRA_SQLITE=y
CONFIG_EDGE_INFRA_DDS=n
CONFIG_EDGE_INFRA_MQTT=n
